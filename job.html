<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job listing | NextdoorJobs</title>
<meta name="description" content="View this job listing and apply.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">
      <img src="img/logo.png" alt="NextdoorJobs" class="mark">
      <span class="wordmark">NextdoorJobs</span>
    </a>
    <nav class="header-nav">
      <a href="work.html">Find work</a>
      <a href="hire.html">Hire someone</a>
    </nav>
  </div>
</header>

<section class="listing-page">
  <div class="wrap">
    <div id="job-listing">
      <div class="listing-card">
        <div class="glow"></div>
        <h1 id="job-service">Loading listing…</h1>
        <p class="location" id="job-location"></p>
        <p class="details" id="job-details" style="display:none;"></p>
        <a id="apply-link" href="work.html" class="btn btn-green">Apply for this job</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 NextdoorJobs. Currently serving Canada and the US.</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
