<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find work — HireKeeper</title>
<meta name="description" content="List what work you do and where. HireKeeper reaches out when a matching job opens up in your area.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo-group">
      <a href="index.html" class="logo"><span class="dot"></span>HireKeeper</a>
      <span class="sponsor-badge">Sponsored by <strong>Nextdoor</strong></span>
    </div>
    <nav class="header-nav">
      <a href="work.html">Find work</a>
      <a href="hire.html">Hire someone</a>
    </nav>
  </div>
</header>

<section class="form-page">
  <div class="wrap">
    <div class="form-head">
      <p class="eyebrow">For job seekers</p>
      <h1>Find work near you</h1>
      <p>Tell us what you do and where. We'll reach out when a job matches.</p>
    </div>

    <div id="job-banner" class="job-banner">
      <span class="glow"></span>
      <span id="job-banner-text"></span>
    </div>

    <form id="work-form" class="card" data-submit-label="Submit my details">
      <div class="form-error"></div>

      <div class="field">
        <label for="work-type">What kind of work do you do?</label>
        <select id="work-type" name="workType" required>
          <option value="" disabled selected>Select one</option>
          <option value="House Sitting">House Sitting</option>
          <option value="Pet Sitting">Pet Sitting</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Housekeeping">Housekeeping</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Where are you based?</label>
        <div class="row-2">
          <input type="text" name="city" placeholder="City" required>
          <input type="text" name="region" placeholder="State / Province" required>
        </div>
        <span class="hint">This is used to match you to nearby jobs only.</span>
      </div>

      <div class="field">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="" disabled selected>Select one</option>
          <option value="Canada">Canada</option>
          <option value="United States">United States</option>
        </select>
      </div>

      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="fullName" placeholder="Jane Smith" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone or WhatsApp number</label>
        <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567" required>
      </div>

      <button type="submit" class="btn btn-green form-submit">Submit my details</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; 2026 HireKeeper. Currently serving Canada and the US.</p>
    <p><a href="mailto:hello@hirekeeper.com" style="color: var(--text-faint); text-decoration: underline;">hello@hirekeeper.com</a></p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
